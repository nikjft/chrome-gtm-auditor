<!DOCTYPE html>
<html>
<head>
  <title>GTM Auditor Panel</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 10px; }
    h2 { border-bottom: 1px solid #ccc; padding-bottom: 5px; margin-top: 0; }
    
    /* Control Bar Styles */
    .control-bar { 
      background: #f9f9f9; 
      padding: 10px; 
      border: 1px solid #ddd; 
      border-radius: 4px;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .control-row { display: flex; gap: 8px; align-items: center; }
    .control-row select { flex-grow: 1; padding: 6px; }
    .control-row input { flex-grow: 1; padding: 6px; }
    
    button { background: #007b83; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 500; }
    button:hover { background: #005f66; }
    button.secondary { background: #666; }
    button.secondary:hover { background: #444; }

    /* Results Styles */
    #results { display: none; }
    #container-header { margin-top: 0; color: #333; }
    #container-id-display { font-weight: bold; color: #007b83; }

    details { border: 1px solid #ddd; border-radius: 4px; margin-top: 10px; }
    details summary { background: #f7f7f7; padding: 10px; cursor: pointer; font-weight: bold; }
    
    .item-list { padding: 5px 15px 15px 15px; }
    
    .item { border-bottom: 1px solid #eee; padding: 8px 0; }
    .item:last-child { border-bottom: none; }
    .item-name { font-weight: bold; color: #333; cursor: pointer; display: inline-block; }
    .item-name:hover { color: #007b83; text-decoration: underline; }
    .item-details { font-size: 0.9em; color: #555; padding-left: 15px; }
    
    .nested-details { margin-left: 15px; margin-top: 8px; }
    .nested-details summary { font-size: 0.9em; font-weight: normal; background: #fafafa; padding: 5px 10px; }
    .nested-details-list { font-size: 0.9em; padding: 0px 5px 5px 15px; background: #fdfdfd; border-left: 2px solid #007b83; }
    .nested-details-list h4 { margin: 10px 0 5px 0; padding-bottom: 3px; border-bottom: 1px solid #eee; }
    
    /* Modal styles */
    .modal-backdrop { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.4); }
    .modal-content { background-color: #fefefe; margin: 10% auto; padding: 20px; border: 1px solid #888; width: 80%; max-height: 70%; overflow-y: auto; box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2); }
    .modal-close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
    .modal-close:hover { color: black; }
    .modal-content pre { background: #eee; padding: 10px; border-radius: 4px; white-space: pre-wrap; word-break: break-all; }
    
    #status-message { margin-top: 5px; font-size: 0.9em; color: #666; }
    .error-text { color: #d93025; }
  </style>
</head>
<body>
  <h2>GTM Container Auditor</h2>
  
  <div class="control-bar">
    <div class="control-row">
      <select id="container-select">
        <option value="" disabled selected>Scanning page...</option>
      </select>
      <button id="refresh-btn" class="secondary" title="Rescan Page">&#x21bb;</button>
      <button id="load-btn">Load</button>
    </div>
    
    <div class="control-row" id="manual-input-row" style="display:none;">
      <input type="text" id="custom-url-input" placeholder="https://example.com/proxied-gtm.js">
    </div>
    
    <div id="status-message"></div>
  </div>
  
  <div id="results">
    <h3 id="container-header">Container: <span id="container-id-display"></span></h3>
    
    <details id="tags-section" open>
      <summary>Tags (<span id="tags-count">0</span>)</summary>
      <div id="tags-list" class="item-list"></div>
    </details>

    <details id="triggers-section">
      <summary>Triggers (<span id="triggers-count">0</span>)</summary>
      <div id="triggers-list" class="item-list"></div>
    </details>

    <details id="variables-section">
      <summary>Variables (<span id="variables-count">0</span>)</summary>
      <div id="variables-list" class="item-list"></div>
    </details>

    <button id="exportButton" style="margin-top:15px; width:100%;">Export as JSON</button>
  </div>

  <iframe id="sandbox-iframe" src="sandbox.html" style="display:none;"></iframe>

  <div id="jsonModal" class="modal-backdrop">
    <div class="modal-content">
      <span class="modal-close">&times;</span>
      <h3>Raw JSON Definition</h3>
      <pre id="json-content"></pre>
    </div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
