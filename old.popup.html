<!DOCTYPE html>
<html>
<head>
  <title>GTM Auditor</title>
  <style>
    /* ... (all the style from before is unchanged) ... */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; width: 500px; padding: 10px; }
    h2 { border-bottom: 1px solid #ccc; padding-bottom: 5px; }
    #container-id { font-weight: bold; color: #007b83; }
    #loading { padding: 10px; }
    button { background: #007b83; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #005f66; }
    details { border: 1px solid #ddd; border-radius: 4px; margin-top: 10px; }
    details summary { background: #f7f7f7; padding: 10px; cursor: pointer; font-weight: bold; }
    .item-list { padding: 5px 15px 15px 15px; max-height: 300px; overflow-y: auto; }
    .item { border-bottom: 1px solid #eee; padding: 8px 0; }
    .item:last-child { border-bottom: none; }
    .item-name { font-weight: bold; color: #333; }
    .item-details { font-size: 0.9em; color: #555; padding-left: 15px; }
    .item-details ul { margin: 5px 0 0 0; padding-left: 20px; }
  </style>
</head>
<body>
  <h2>GTM Container Auditor</h2>
  <div id="loading">Scanning page for GTM container...</div>
  
  <div id="results" style="display:none;">
    <p>Container: <span id="container-id"></span></p>
    
    <details id="tags-section">
      <summary>Tags (<span id="tags-count">0</span>)</summary>
      <div id="tags-list" class="item-list"></div>
    </details>

    <details id="triggers-section">
      <summary>Triggers (<span id="triggers-count">0</span>)</summary>
      <div id="triggers-list" class="item-list"></div>
    </details>

    <details id="variables-section">
      <summary>Variables (<span id="variables-count">0</span>)</summary>
      <div id="variables-list" class="item-list"></div>
    </details>

    <button id="exportButton">Export as JSON</button>
  </div>

  <div id="error" style="display:none; color: red;"></div>

  <iframe id="sandbox-iframe" src="sandbox.html" style="display:none;"></iframe>

  <script src="popup.js"></script>
</body>
</html>
